name: One-time highlight card spacing fix

on:
  push:
    branches:
      - fix/digital-points-way-card-spacing-2026-08-21

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'fix: spread Digital Points Way cards') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Spread desktop highlight cards
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('digitalpoints/src/components/Services.tsx')
          s = p.read_text()
          old = 'const collapsedX = index === 0 ? "-16%" : index === 1 ? "0%" : "16%";'
          new = 'const collapsedX = index === 0 ? "-32%" : index === 1 ? "0%" : "32%";'
          if old not in s:
              raise SystemExit('Expected collapsed card spacing rule was not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add digitalpoints/src/components/Services.tsx
          git commit -m "fix: spread Digital Points Way cards"
          git push

