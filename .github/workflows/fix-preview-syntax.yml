name: Fix preview syntax

on:
  push:
    branches:
      - fix/digital-points-way-preview-restore-2026-08-21

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'fix: preview syntax') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix Services syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('digitalpoints/src/components/Services.tsx')
          s = p.read_text()
          old = 'index === services.length - 1 ? "0%" : "-112%");'
          new = 'index === services.length - 1 ? "0%" : "-112%"]);'
          if old not in s:
              raise SystemExit('Expected syntax typo not found')
          p.write_text(s.replace(old, new, 1))
          PY
          rm .github/workflows/fix-preview-syntax.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add digitalpoints/src/components/Services.tsx .github/workflows/fix-preview-syntax.yml
          git commit -m "fix: preview syntax"
          git push
