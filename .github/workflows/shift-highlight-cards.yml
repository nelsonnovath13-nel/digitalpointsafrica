name: One-time card position fix

on:
  push:
    branches:
      - tmp-shift-cards-2026-08-21

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'fix: move highlight cards right') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move desktop highlight cluster right
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('digitalpoints/src/components/Services.tsx')
          s = p.read_text()
          old = 'className="absolute right-0 top-1/2 h-[330px] w-[min(52vw,650px)] -translate-y-1/2"'
          new = 'className="absolute right-[clamp(-240px,-10vw,-140px)] top-1/2 h-[330px] w-[min(52vw,650px)] -translate-y-1/2"'
          if old not in s:
              raise SystemExit('Expected highlight cluster position was not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add digitalpoints/src/components/Services.tsx
          git commit -m "fix: move highlight cards right"
          git push