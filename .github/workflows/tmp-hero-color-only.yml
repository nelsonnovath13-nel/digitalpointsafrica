name: Temporary Hero Color Edit

on:
  push:
    branches:
      - fix/digital-points-hero-deep-teal-2026-08-22

permissions:
  contents: write

jobs:
  edit-hero-colors:
    if: ${{ !contains(github.event.head_commit.message, 'fix: apply hero deep teal colors') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Change only hero color values
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('digitalpoints/src/components/Hero.tsx')
          s = p.read_text()
          replacements = [
              ('backgroundColor: "rgba(0, 199, 195, 0.74)"', 'backgroundColor: "rgba(5, 78, 75, 0.94)"'),
              ('tracking-[-0.035em] text-black sm:text-[2rem]', 'tracking-[-0.035em] text-[#F5FFFE] sm:text-[2rem]'),
              ('tracking-[-0.01em] text-black/90 sm:mt-5', 'tracking-[-0.01em] text-white/90 sm:mt-5'),
              ('border border-white bg-white px-5 font-poppins text-[13px]', 'border border-[#00c7c3] bg-[#00c7c3] px-5 font-poppins text-[13px]'),
              ('border border-white/90 bg-transparent px-5 font-poppins text-[13px] font-medium tracking-[-0.01em] text-white shadow-[0_0_0_0_rgba(255,255,255,0)] transition-all duration-300 hover:border-white hover:bg-white/95 hover:text-[#050b1f] hover:shadow-[0_10px_28px_rgba(255,255,255,0.18)] active:bg-white active:text-[#050b1f]', 'border border-[#7DEDE8]/90 bg-transparent px-5 font-poppins text-[13px] font-medium tracking-[-0.01em] text-[#F5FFFE] shadow-[0_0_0_0_rgba(255,255,255,0)] transition-all duration-300 hover:border-[#00c7c3] hover:bg-[#00c7c3] hover:text-[#050b1f] hover:shadow-[0_10px_28px_rgba(255,255,255,0.18)] active:bg-[#00c7c3] active:text-[#050b1f]'),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'Marker not found: {old}')
              s = s.replace(old, new)
          p.write_text(s)
          PY
          rm .github/workflows/tmp-hero-color-only.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add digitalpoints/src/components/Hero.tsx .github/workflows/tmp-hero-color-only.yml
          git commit -m "fix: apply hero deep teal colors"
          git push
