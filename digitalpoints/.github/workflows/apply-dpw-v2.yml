name: Apply Digital Points Way cards v2

on:
  push:
    branches:
      - feat/digital-points-way-card-motion-2026-08-21

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: digitalpoints/package-lock.json
      - name: Apply card implementation
        working-directory: digitalpoints
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('src/components/Services.tsx')
          s=p.read_text()
          s=s.replace('import { useEffect, useRef, useState, type PointerEvent } from "react";','import { useEffect, useRef, useState } from "react";')
          s=re.sub(r'function CursorSnow\([\s\S]*?\n}\n\nfunction HighlightCards','function HighlightCards',s,count=1)
          s=re.sub(r'const highlights: Highlight\[\] = \[[\s\S]*?\n\];\n\nfunction HighlightIcon','''const highlights: Highlight[] = [
  { title: "CREATE", description: "We turn ideas into creative digital solutions, compelling visuals, engaging videos, and designs that capture attention." },
  { title: "BRAND", description: "We transform ideas into strong, professional, and memorable brands through branding, graphic design, marketing, and printing." },
  { title: "GROW", description: "We help brands connect with their audience, increase their visibility, and create opportunities for sustainable business growth." },
];

function HighlightIcon''',s,count=1)
          block=r'''function HighlightCards({ introRef: _introRef }: { introRef: React.RefObject<HTMLElement | null> }) {
  const [activeIndex,setActiveIndex]=useState(0);
  const [desktopExpanded,setDesktopExpanded]=useState(false);
  const [hoveredIndex,setHoveredIndex]=useState<number|null>(null);
  const mobileScrollerRef=useRef<HTMLDivElement>(null);
  useEffect(()=>{
    const root=mobileScrollerRef.current;if(!root)return;
    const cards=Array.from(root.querySelectorAll<HTMLElement>('[data-dpw-mobile-card]'));
    const observer=new IntersectionObserver(entries=>{
      const visible=entries.filter(e=>e.isIntersecting).sort((a,b)=>b.intersectionRatio-a.intersectionRatio)[0];
      if(!visible)return;const index=cards.indexOf(visible.target as HTMLElement);if(index>=0)setActiveIndex(index);
    },{root,threshold:[0.45,0.65,0.85]});
    cards.forEach(card=>observer.observe(card));return()=>observer.disconnect();
  },[]);
  const accent=(i:number)=>i===0?'#3DA9FC':i===1?'#F45CA0':'#F5B942';
  return <div className="relative mx-auto mt-10 w-full sm:mt-12 lg:mt-14">
    <div ref={mobileScrollerRef} className="relative flex h-[100dvh] snap-y snap-mandatory flex-col overflow-y-auto overscroll-y-contain bg-[#141414] [scrollbar-width:none] max-[899px]:-mx-5 max-[899px]:w-[calc(100%+40px)] [&::-webkit-scrollbar]:hidden min-[900px]:hidden">
      <div className="pointer-events-none absolute right-4 top-1/2 z-20 flex -translate-y-1/2 flex-col gap-4">
        {highlights.map((h,i)=><span key={h.title} className={`block w-[6px] rounded-full transition-all duration-500 ${activeIndex===i?'h-[22px] bg-[#F4EFE6]':'h-[6px] bg-white/30'}`}/>)}</div>
      {highlights.map((h,i)=>{const color=accent(i);const active=activeIndex===i;return <article key={h.title} data-dpw-mobile-card className="relative flex min-h-[100dvh] h-[100dvh] snap-center snap-always flex-col justify-center overflow-hidden bg-[#141414] px-7 py-[84px] text-[#F4EFE6]" style={{backgroundImage:`radial-gradient(circle at 78% 18%, ${color}2e, transparent 48%)`}}>
        <div className="relative z-10 mx-auto flex w-full max-w-[420px] flex-col">
          <div className="w-fit overflow-hidden"><motion.h3 initial={{y:'105%'}} animate={{y:active?'0%':'105%'}} transition={{duration:.8,delay:.15,ease:[.22,1,.36,1]}} style={{fontFamily:'"Space Grotesk",sans-serif'}} className="text-[clamp(48px,15vw,72px)] font-bold leading-[.92] tracking-[-.035em] text-[#F4EFE6]">{h.title}</motion.h3></div>
          <motion.div initial={{opacity:0,scale:.7,rotate:-25}} animate={{opacity:active?1:0,scale:active?1:.7,rotate:active?0:-25}} transition={{duration:.7,delay:.35,ease:[.22,1,.36,1]}} className="relative mx-auto my-[34px] flex h-[132px] w-[132px] items-center justify-center">
            <motion.div animate={{rotate:active?360:0}} transition={{duration:16,repeat:Infinity,ease:'linear'}} className="absolute inset-0 rounded-full border border-white/20"><span className="absolute left-1/2 top-[-3.5px] h-[7px] w-[7px] -translate-x-1/2 rounded-full" style={{backgroundColor:color,boxShadow:`0 0 16px 4px ${color}`}}/></motion.div>
            <div className="relative z-10 flex h-[74px] w-[74px] items-center justify-center text-[#F4EFE6]"><HighlightIcon title={h.title}/></div>
          </motion.div>
          <motion.div initial={{opacity:0,y:16}} animate={{opacity:active?1:0,y:active?0:16}} transition={{duration:.7,delay:.55,ease:[.22,1,.36,1]}} className="text-center"><p style={{fontFamily:'"Inter",sans-serif'}} className="mx-auto max-w-[340px] text-[15px] leading-[1.55] text-white/80">{h.description}</p><div className="mx-auto mt-[18px] h-[3px] w-full max-w-[340px] overflow-hidden rounded-full bg-white/[.12]"><motion.div initial={{scaleX:0}} animate={{scaleX:active?1:0}} transition={{duration:1.1,delay:.7,ease:[.22,1,.36,1]}} style={{originX:0,backgroundColor:color}} className="h-full w-full rounded-full"/></div></motion.div>
        </div>
        <motion.span initial={{opacity:0,scale:1}} animate={{opacity:active?1:0,scale:active?[1,1.35,1]:1}} transition={{duration:2.4,delay:.8,repeat:active?Infinity:0,ease:'easeInOut'}} className="absolute bottom-[34px] right-7 h-[18px] w-[18px] rounded-full" style={{backgroundColor:color,boxShadow:`0 0 24px 8px ${color}99`}}/>
      </article>})}
    </div>
    <div className="relative mx-auto hidden h-[520px] max-w-[1180px] items-center justify-center min-[900px]:flex" onMouseEnter={()=>setDesktopExpanded(true)} onMouseLeave={()=>{setDesktopExpanded(false);setHoveredIndex(null)}}>
      {highlights.map((h,i)=>{const color=accent(i);const hovered=hoveredIndex===i;const resting={x:i===0?-14:i===1?0:14,y:i===1?-4:6,rotate:i===0?-5:i===1?1:6};const spread={x:i===0?-330:i===1?0:330,y:i===1?-26:0,rotate:i===0?-6:i===1?0:6};const pos=desktopExpanded?spread:resting;return <motion.article key={h.title} animate={{x:pos.x,y:hovered&&desktopExpanded?pos.y-14:pos.y,rotate:hovered&&desktopExpanded?0:pos.rotate,scale:hovered&&desktopExpanded?1.02:1}} transition={{duration:.75,ease:[.22,1,.36,1]}} onMouseEnter={()=>setHoveredIndex(i)} className="absolute left-1/2 top-1/2 flex h-[440px] w-[320px] -translate-x-1/2 -translate-y-1/2 cursor-pointer flex-col justify-between overflow-hidden rounded-[20px] bg-[#141414] p-[34px_30px] text-[#F4EFE6] shadow-[0_30px_70px_-25px_rgba(0,0,0,.55)]" style={{zIndex:hovered?20:3-i}}>
        <h3 style={{fontFamily:'"Space Grotesk",sans-serif'}} className="text-[38px] font-bold leading-none tracking-[-.01em]">{h.title}</h3>
        <div className="relative mx-auto flex h-[132px] w-[132px] items-center justify-center rounded-full border border-white/20"><span className="absolute left-1/2 top-[-4px] h-2 w-2 -translate-x-1/2 rounded-full" style={{backgroundColor:color,boxShadow:`0 0 14px 4px ${color}`}}/><HighlightIcon title={h.title}/></div>
        <div><p style={{fontFamily:'"Inter",sans-serif'}} className="text-[14.5px] leading-[1.55] text-white/80">{h.description}</p><div className="mt-4 h-[3px] w-full overflow-hidden rounded-full bg-white/[.14]"><motion.div initial={{scaleX:0}} animate={{scaleX:hovered?1:0}} transition={{duration:.6,ease:[.22,1,.36,1]}} style={{originX:0,backgroundColor:color}} className="h-full w-full rounded-full"/></div></div>
      </motion.article>})}
    </div>
  </div>;
}'''
          s,n=re.subn(r'function HighlightCards\(\{[^)]*\}\) \{[\s\S]*?\n}\n\nfunction ServiceCard',block+'\n\nfunction ServiceCard',s,count=1)
          if n!=1: raise SystemExit(f'HighlightCards replacement count={n}')
          p.write_text(s)
          PY
      - name: Build
        working-directory: digitalpoints
        run: npm ci && npm run build
      - name: Commit and clean workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f digitalpoints/.github/workflows/dpw-card-motion.yml digitalpoints/.github/workflows/apply-dpw-v2.yml
          git add digitalpoints/src/components/Services.tsx
          git commit -m "feat: implement Digital Points Way responsive card motion"
          git push origin HEAD:feat/digital-points-way-card-motion-2026-08-21
